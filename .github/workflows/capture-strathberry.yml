name: Capture Strathberry

on:
  schedule:
    # 07:00 UTC daily
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: capture-strathberry
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture Strathberry homepage
        id: capture
        run: npm run capture:strathberry
        continue-on-error: true

      - name: Commit capture output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/captures
          if git diff --cached --quiet; then
            echo "No capture changes to commit."
          else
            git commit -m "chore: capture Strathberry homepage ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Fail workflow if capture was unsuccessful
        if: steps.capture.outcome == 'failure'
        run: |
          echo "Capture script reported a failure — see the committed JSON record for details."
          exit 1
